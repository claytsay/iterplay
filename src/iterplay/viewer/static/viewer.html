<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only this page's own script, styles and the run artifacts may load: no external
       resources, no inline script, and no markup from data (see viewer.js). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self';
                 media-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iterplay viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <header>
    <h1>iterplay</h1>
    <label>Run <select id="run-select" disabled></select></label>
    <p id="run-meta"></p>
  </header>

  <noscript><p>The viewer needs JavaScript.</p></noscript>
  <p id="status" role="status" aria-live="polite">Loading runs…</p>

  <main id="run" hidden>
    <!-- Version timeline (v1 ... vN) with a score sparkline. -->
    <section id="timeline" aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">Versions</h2>
      <div id="sparkline"></div>
      <ol id="versions"></ol>
    </section>

    <!-- v1 and the selected version, side by side, for one bot. -->
    <section id="playtests" aria-labelledby="playtests-heading">
      <div class="section-head">
        <h2 id="playtests-heading">Playtests</h2>
        <label>Bot <select id="bot-select"></select></label>
        <button id="play-both" type="button">Play both</button>
      </div>
      <div id="videos">
        <figure id="slot-first" class="slot">
          <figcaption></figcaption>
          <video id="video-first" controls muted playsinline preload="metadata" hidden></video>
          <p class="placeholder"></p>
        </figure>
        <figure id="slot-current" class="slot">
          <figcaption></figcaption>
          <video id="video-current" controls muted playsinline preload="metadata" hidden></video>
          <p class="placeholder"></p>
        </figure>
      </div>
    </section>

    <div class="details">
      <!-- Verified issues. Clicking a timestamp seeks the selected version's video;
           contradicted claims are listed as caught hallucinations. -->
      <section id="issues" aria-labelledby="issues-heading">
        <h2 id="issues-heading">Verified issues</h2>
        <div id="issue-list"></div>
      </section>

      <div class="side">
        <!-- Patch notes (changelog.md) for the selected version. -->
        <section id="patch-notes" aria-labelledby="patch-notes-heading">
          <h2 id="patch-notes-heading">Patch notes</h2>
          <div id="patch-notes-body"></div>
        </section>

        <!-- The selected version's score.json, item by item. -->
        <section id="score" aria-labelledby="score-heading">
          <h2 id="score-heading">Score</h2>
          <div id="score-body"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
