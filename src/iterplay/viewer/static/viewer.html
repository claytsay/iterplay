<!doctype html>

  <title>iterplay viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1400px; padding: 1rem; }
    #videos { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    video { width: 100%; background: #000; }

  <header>
    <h1>iterplay</h1>
    <label>Run <select id="run-select"></select></label>

    <!-- Version timeline (v1 ... vN) with a score sparkline. -->
    <section id="timeline" aria-label="Version timeline"></section>

    <!-- v1 and the selected version, side by side. -->
    <section id="videos" aria-label="First and selected version">
      <video id="video-first" controls muted></video>
      <video id="video-current" controls muted></video>
    </section>

    <!-- Verified issues. Clicking a timestamp seeks the matching video;
         contradicted claims are listed as caught hallucinations. -->
    <section id="issues" aria-label="Verified issues"></section>

    <!-- Patch notes (changelog.md) for the selected version. -->
    <section id="patch-notes" aria-label="Patch notes"></section>
  </main>
