<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tunnel Turbulence</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body { display: flex; align-items: center; justify-content: center;
           color: #f6e7c8; font: 600 16px/1.3 ui-monospace, Menlo, Consolas, monospace; }
    #frame { position: relative; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
    #stage, #hud { position: absolute; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #hud { pointer-events: none; text-shadow: 0 2px 0 #000; }
    #hud-stats { position: absolute; top: 12px; left: 16px; }
    #hud-warning { position: absolute; top: 40px; left: 16px; color: #ff6b4a;
                   animation: blink 0.5s steps(2) infinite; }
    #hud-harness { position: absolute; top: 10px; right: 12px; padding: 2px 8px;
                   background: rgba(0, 0, 0, 0.6); }
    #hud-banner { position: absolute; top: 36%; width: 100%; text-align: center; }
    #hud-banner h1 { margin: 0; font-size: 48px; color: #ffd166; }
    [hidden] { display: none !important; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
</head>
<body>
  <div id="frame">
    <div id="stage"></div>
    <div id="hud">
      <div id="hud-stats"></div>
      <div id="hud-warning" hidden>CAVE-IN!</div>
      <div id="hud-harness" hidden></div>
      <div id="hud-banner" hidden><h1></h1><p></p></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
